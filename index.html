<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golf App</title>
  <!-- Unregister any stale service workers (leftover from CRA) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
          console.log('[SW] Unregistered stale service worker:', registration.scope);
        }
      });
    }
  </script>

  <!-- Prevent flash of wrong theme: apply saved theme class before paint -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      var isDark = saved ? saved === 'dark' : true;
      document.documentElement.classList.add(isDark ? 'dark-mode' : 'light-mode');
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <!-- ✅ Razorpay Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- ✅ React App (VERY IMPORTANT) -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
